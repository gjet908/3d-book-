
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>THE LAST CHAPTER — an interactive book</title>
<meta name="description" content="THE LAST CHAPTER — a cinematic, interactive 3D book you open by scrolling." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loader -->
  <div id="loader">
    <div class="loader-mark">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- Fixed 3D stage -->
  <div id="canvas-container">
    <canvas id="webgl"></canvas>
  </div>

  <!-- Cinematic vignette + grain overlays (pure CSS, sit above canvas) -->
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Minimal UI -->
  <header class="ui-top">
    <span class="ui-title">The Last Chapter</span>
  </header>

  <div class="ui-hint" id="scrollHint">
    <span class="ui-hint-label">Scroll to open</span>
    <div class="hint-rail"><div class="hint-dot"></div></div>
  </div>

  <div class="ui-finale" id="finaleUI">
    <p class="finale-text">The story continues.</p>
    <button class="finale-btn" id="readMoreBtn" type="button">Read again</button>
  </div>

  <!-- Scroll length driver — the canvas stays fixed, this just gives the page height to scroll through -->
  <div class="scroll-spacer" aria-hidden="true"></div>

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <!-- Three.js via import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module" src="script.js"></script>
</body>
</html>
