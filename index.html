<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080B18">
  <title>Happy Birthday Naved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow" id="bgGlow"></div>
  <canvas id="scene" aria-hidden="true"></canvas>

  <main class="ui">
    <header class="top">
      <p class="intro" id="intro">A Special Day for Someone Special</p>
      <div class="main" id="main">
        <h2 class="hb">Happy Birthday</h2>
        <h1 class="name">Naved</h1>
      </div>
    </header>

    <footer class="bottom">
      <p class="wish" id="wish">Wishing you a year filled with happiness, unforgettable moments, and endless possibilities.</p>
      <div class="actions" id="actions">
        <button type="button" id="celebrate" class="btn btn-primary">Celebrate ✨</button>
        <button type="button" id="replay" class="btn btn-ghost">Replay ↺</button>
      </div>
    </footer>
  </main>

  <canvas id="fx" aria-hidden="true"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
